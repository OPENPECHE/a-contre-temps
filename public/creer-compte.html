<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Créer mon compte — à contre-temps, Fournil vivant</title>
<meta name="description" content="Créez votre compte fidélité à contre-temps : suivez vos tampons et récupérez votre produit offert tous les 10 achats." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://www.fournilvivant.fr/creer-compte" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<meta name="theme-color" content="#7C97AC" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bd:#3E5A70;--b:#7C97AC;--bs:#D6DFE5;--cr:#F3E7DA;--pp:#FBF8F4;--ink:#2B2925;--is:rgba(43,41,37,.62);--ru:#A6713F;--gn:#7C8B5E;--rd:#B0402F;--serif:'Fraunces',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--pp);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:inherit;}
  header{background:var(--b);color:var(--cr);text-align:center;padding:30px 20px 30px;}
  header .heart{height:54px;width:auto;margin:0 auto 12px;display:block;}
  header .brand{font-family:var(--serif);font-size:30px;font-style:italic;line-height:1.1;}
  header .sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-top:8px;}
  header h1{font-family:var(--serif);font-weight:400;font-size:clamp(25px,5vw,32px);margin-top:14px;}
  .wrap{max-width:440px;margin:0 auto;padding:24px 18px 50px;}
  .card{background:#fff;border:1px solid var(--bs);border-radius:18px;padding:22px 20px;box-shadow:0 8px 28px rgba(43,41,37,.07);}
  .intro{text-align:center;color:var(--is);font-size:14px;margin-bottom:16px;}
  .intro b{color:var(--ru);}
  label{display:block;font-size:12px;color:var(--is);margin:12px 0 5px;}
  .fi{width:100%;padding:13px;border:1px solid var(--bs);border-radius:11px;font-size:16px;font-family:var(--sans);background:#fff;color:var(--ink);}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;margin-top:18px;background:var(--bd);color:var(--cr);}
  .btn:disabled{opacity:.6;}
  .btn.ghost{background:transparent;color:var(--bd);border:1px solid var(--bs);margin-top:10px;}
  .msg{font-size:13px;min-height:18px;margin-top:10px;text-align:center;}
  .msg.err{color:var(--rd);}
  .foot{text-align:center;font-size:13px;color:var(--is);margin-top:18px;}
  .foot a{color:var(--bd);font-weight:500;}
  .ok-screen{text-align:center;padding:14px 6px;}
  .ok-screen .big{font-family:var(--serif);font-size:24px;color:var(--bd);margin:8px 0;}
  .code-in{width:100%;padding:14px;border:1px solid var(--bs);border-radius:12px;font-size:28px;text-align:center;letter-spacing:7px;font-family:var(--sans);font-weight:600;color:var(--bd);}
  .topnav{background:var(--bd);}
  .topnav .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;max-width:760px;margin:0 auto;}
  .topnav .brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--serif);font-size:22px;color:var(--cr);text-decoration:none;letter-spacing:-.01em;}
  .topnav .brand img{height:26px;width:auto;display:block;}
  .topnav .navr{display:flex;gap:16px;align-items:center;}
  .topnav .navlink{color:var(--cr);text-decoration:none;font-size:13px;font-weight:500;opacity:.92;}
  .topnav .cta{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--bd);background:var(--cr);padding:9px 16px;border-radius:999px;text-decoration:none;white-space:nowrap;}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav">
    <a href="/" class="brand"><img src="/heart-cream.png" alt="" /> à contre-temps</a>
    <div class="navr">
      <a href="/commander-marche" class="navlink">Commander</a>
      <a href="/" class="cta">Accueil</a>
    </div>
  </div>
</nav>
<header>
  <img class="heart" src="/heart-cream.png" alt="" />
  <h1>Créer mon compte</h1>
</header>

<div class="wrap">
  <div class="card" id="card">
    <p class="intro">Suivez vos tampons et récupérez <b>un produit offert tous les 10 achats</b> 🎁<br>Au marché, donnez simplement votre numéro à l'encaissement.</p>
    <div class="row2">
      <div><label for="prenom">Prénom</label><input class="fi" id="prenom" autocomplete="given-name" /></div>
      <div><label for="nom">Nom</label><input class="fi" id="nom" autocomplete="family-name" /></div>
    </div>
    <label for="phone">Numéro de portable <span style="color:var(--ru)">(votre carte de fidélité)</span></label>
    <input class="fi" id="phone" inputmode="numeric" autocomplete="tel" placeholder="06 12 34 56 78" />
    <label for="email">E‑mail</label>
    <input class="fi" id="email" type="email" autocomplete="email" placeholder="votre@email.fr" />
    <div class="msg err" id="msg"></div>
    <button class="btn" id="go">Recevoir mon code</button>
  </div>
  <p class="foot">Vous avez déjà un compte ? <a href="/mon-compte">Se connecter</a></p>
</div>

<script>
var SB_URL="https://jxxgafyqfbnqieiqltcn.supabase.co";
var SB_KEY="sb_publishable_MdBMZ53hCDINWEu8jfsrzQ_sOeIuqZo";
function normPhone(s){ return String(s||"").replace(/\D/g,""); }
function fmtPhone(p){ return String(p||"").replace(/(\d{2})(?=\d)/g,"$1 ").trim(); }
var pending=null; // {prenom,nom,phone,email}

var phone=document.getElementById("phone"), msg=document.getElementById("msg");
phone.addEventListener("input",function(){ phone.value=fmtPhone(normPhone(phone.value).slice(0,10)); });
try{ var sp=localStorage.getItem("acontretemps_phone"); if(sp) phone.value=fmtPhone(sp); }catch(e){}

document.getElementById("go").onclick=sendCode;

function sendCode(){
  var prenom=document.getElementById("prenom").value.trim();
  var nom=document.getElementById("nom").value.trim();
  var ph=normPhone(phone.value);
  var email=document.getElementById("email").value.trim();
  msg.className="msg err"; msg.textContent="";
  if(!prenom||!nom){ msg.textContent="Indiquez vos prénom et nom."; return; }
  if(ph.length<10){ msg.textContent="Numéro de portable à 10 chiffres."; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent="E‑mail invalide."; return; }
  try{ localStorage.setItem("acontretemps_phone",ph); }catch(e){}
  pending={prenom:prenom,nom:nom,phone:ph,email:email};
  var go=document.getElementById("go"); go.disabled=true; go.textContent="Envoi du code…";

  fetch(SB_URL+"/auth/v1/otp",{method:"POST",
    headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({ email:email, create_user:true, data:{ prenom:prenom, nom:nom, phone:ph } })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,j:j}; }); })
  .then(function(res){
    if(!res.ok){ msg.textContent="Impossible d'envoyer le code ("+(res.j.msg||res.j.error_description||res.status)+")."; go.disabled=false; go.textContent="Recevoir mon code"; return; }
    showCodeStep();
  })
  .catch(function(){ msg.textContent="Connexion impossible, réessayez."; go.disabled=false; go.textContent="Recevoir mon code"; });
}

function showCodeStep(){
  document.getElementById("card").innerHTML=
     '<p class="intro">Un <b>code à 6 chiffres</b> vient d\'être envoyé à<br><b style="color:var(--bd)">'+pending.email.replace(/</g,"")+'</b></p>'
    +'<label for="code">Votre code</label>'
    +'<input class="code-in" id="code" inputmode="numeric" maxlength="8" placeholder="••••••" />'
    +'<div class="msg err" id="msg2"></div>'
    +'<button class="btn" id="verify">Valider et créer mon compte</button>'
    +'<button class="btn ghost" id="resend">Renvoyer un code</button>';
  var code=document.getElementById("code");
  setTimeout(function(){ try{ code.focus(); }catch(e){} },60);
  code.addEventListener("input",function(){ code.value=code.value.replace(/\D/g,"").slice(0,8); });
  document.getElementById("verify").onclick=verifyCode;
  document.getElementById("resend").onclick=function(){ var email=pending.email; fetch(SB_URL+"/auth/v1/otp",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,create_user:true,data:{prenom:pending.prenom,nom:pending.nom,phone:pending.phone}})}); document.getElementById("msg2").style.color="var(--is)"; document.getElementById("msg2").textContent="Nouveau code envoyé."; };
}

function verifyCode(){
  var code=document.getElementById("code").value.replace(/\D/g,"");
  var msg2=document.getElementById("msg2");
  if(code.length<6){ msg2.textContent="Entrez les 6 chiffres."; return; }
  var b=document.getElementById("verify"); b.disabled=true; b.textContent="Vérification…";
  fetch(SB_URL+"/auth/v1/verify",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({ type:"email", email:pending.email, token:code })
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
  .then(function(res){
    if(!res.ok || !res.j.access_token){ msg2.textContent="Code incorrect ou expiré."; b.disabled=false; b.textContent="Valider et créer mon compte"; return; }
    try{ localStorage.setItem("act_token",res.j.access_token); localStorage.setItem("act_refresh",res.j.refresh_token); }catch(e){}
    // enregistre les infos sur le compte + active la carte fidélité
    saveProfile(res.j.access_token);
    success(pending.prenom);
  })
  .catch(function(){ msg2.textContent="Connexion impossible, réessayez."; b.disabled=false; b.textContent="Valider et créer mon compte"; });
}

function saveProfile(token){
  // met à jour les métadonnées (prénom/nom/téléphone) même pour un compte existant
  fetch(SB_URL+"/auth/v1/user",{method:"PUT",headers:{apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({ data:{ prenom:pending.prenom, nom:pending.nom, phone:pending.phone } })}).catch(function(){});
  // lie à la carte de fidélité (registered = true) sans écraser les tampons
  var h={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
  var name=pending.prenom+" "+pending.nom, ph=pending.phone;
  fetch(SB_URL+"/rest/v1/loyalty?phone=eq."+encodeURIComponent(ph)+"&select=phone",{headers:h})
    .then(function(r){return r.json();}).then(function(rows){
      if(Array.isArray(rows)&&rows[0]) fetch(SB_URL+"/rest/v1/loyalty?phone=eq."+encodeURIComponent(ph),{method:"PATCH",headers:h,body:JSON.stringify({name:name,registered:true,updated_at:new Date().toISOString()})});
      else fetch(SB_URL+"/rest/v1/loyalty",{method:"POST",headers:Object.assign({Prefer:"resolution=merge-duplicates"},h),body:JSON.stringify({phone:ph,name:name,registered:true,stamps:0,free_breads:0,total_stamps:0,updated_at:new Date().toISOString()})});
    }).catch(function(){});
}

function success(prenom){
  document.getElementById("card").innerHTML='<div class="ok-screen">'
    +'<div style="font-size:42px;">🥖</div>'
    +'<div class="big">Bienvenue '+String(prenom).replace(/</g,"")+' !</div>'
    +'<p style="color:var(--is);">Votre compte fidélité est créé et activé.</p>'
    +'<p style="color:var(--is);margin-top:8px;">Au marché, donnez votre numéro à l\'encaissement pour gagner vos tampons.</p>'
    +'<a href="/mon-compte" class="btn" style="display:block;text-decoration:none;text-align:center;">Voir ma carte de fidélité</a>'
    +'</div>';
}
</script>
</body>
</html>
