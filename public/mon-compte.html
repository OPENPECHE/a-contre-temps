<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon compte — à contre-temps, Fournil vivant</title>
<meta name="description" content="Votre compte fidélité à contre-temps : suivez vos tampons et votre produit offert." />
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://www.fournilvivant.fr/mon-compte" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<meta name="theme-color" content="#7C97AC" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bd:#3E5A70;--b:#7C97AC;--bs:#D6DFE5;--cr:#F3E7DA;--pp:#FBF8F4;--ink:#2B2925;--is:rgba(43,41,37,.62);--ru:#A6713F;--gn:#7C8B5E;--rd:#B0402F;--serif:'Fraunces',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--pp);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
  a{color:inherit;}
  header{background:var(--b);color:var(--cr);text-align:center;padding:30px 20px 30px;}
  header .heart{height:54px;width:auto;margin:0 auto 12px;display:block;}
  header .brand{font-family:var(--serif);font-size:30px;font-style:italic;line-height:1.1;}
  header .sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-top:8px;}
  header h1{font-family:var(--serif);font-weight:400;font-size:clamp(26px,5vw,34px);margin-top:14px;}
  .wrap{max-width:440px;margin:0 auto;padding:24px 18px 50px;}
  .card{background:#fff;border:1px solid var(--bs);border-radius:18px;padding:22px 20px;box-shadow:0 8px 28px rgba(43,41,37,.07);}
  .intro{text-align:center;color:var(--is);font-size:14px;margin-bottom:6px;}
  label{display:block;font-size:12px;color:var(--is);margin:12px 0 5px;}
  .fi{width:100%;padding:13px;border:1px solid var(--bs);border-radius:11px;font-size:16px;font-family:var(--sans);background:#fff;color:var(--ink);}
  .code-in{width:100%;padding:14px;border:1px solid var(--bs);border-radius:12px;font-size:28px;text-align:center;letter-spacing:7px;font-family:var(--sans);font-weight:600;color:var(--bd);}
  .btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;background:var(--bd);color:var(--cr);}
  .btn.ghost{background:transparent;color:var(--bd);border:1px solid var(--bs);}
  .btn:disabled{opacity:.6;}
  .msg{font-size:13px;min-height:18px;margin-top:10px;text-align:center;color:var(--rd);}
  .foot{text-align:center;font-size:13px;color:var(--is);margin-top:18px;}
  .foot a{color:var(--bd);font-weight:500;}
  .result{text-align:center;}
  .result .big{font-family:var(--serif);font-size:24px;color:var(--bd);margin:2px 0 4px;}
  .dots{margin:16px 0 8px;line-height:1;}
  .dot{display:inline-block;width:26px;height:26px;border-radius:50%;margin:4px;border:2px solid var(--bd);vertical-align:middle;}
  .dot.on{background:var(--bd);}
  .count{font-size:15px;color:var(--is);}
  .free{margin-top:16px;background:var(--cr);border-radius:12px;padding:14px;color:var(--ru);font-weight:600;}
  .sec{font-family:var(--serif);font-size:19px;color:var(--bd);margin:24px 0 14px;padding-top:20px;border-top:1px solid var(--bs);font-weight:500;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;min-width:0;}
  /* barre de navigation (même charte que le reste du site) */
  .topnav{background:var(--bd);}
  .topnav .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1000px;margin:0 auto;}
  .topnav .brand{display:inline-flex;align-items:center;gap:11px;font-family:var(--serif);font-size:26px;color:var(--cr);text-decoration:none;letter-spacing:-.01em;}
  .topnav .brand img{height:38px;width:auto;display:block;}
  .topnav .navr{display:flex;gap:16px;align-items:center;}
  .topnav .navlink{color:var(--cr);text-decoration:none;font-size:13px;font-weight:500;opacity:.92;}
  .topnav .cta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--bd);background:var(--cr);padding:10px 18px;border-radius:999px;text-decoration:none;white-space:nowrap;}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav">
    <a href="/" class="brand"><img src="/heart-cream.png" alt="" /> à contre-temps</a>
    <div class="navr">
      <a href="/commander-marche" class="navlink">Commander</a>
      <a href="/" class="cta">Accueil</a>
    </div>
  </div>
</nav>
<header>
  <img class="heart" src="/heart-cream.png" alt="" />
  <h1>Mon compte</h1>
</header>

<div class="wrap">
  <div class="card" id="card"><p class="count" style="text-align:center;padding:20px 0;">Chargement…</p></div>
  <p class="foot" id="foot"></p>
</div>

<script>
var SB_URL="https://jxxgafyqfbnqieiqltcn.supabase.co";
var SB_KEY="sb_publishable_MdBMZ53hCDINWEu8jfsrzQ_sOeIuqZo";
function eur(n){ return (Math.round(n*100)/100).toFixed(2).replace(".",",")+" €"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];}); }
function normPhone(s){ return String(s||"").replace(/\D/g,""); }
function fmtPhone(p){ return String(p||"").replace(/(\d{2})(?=\d)/g,"$1 ").trim(); }
function getAT(){ try{ return localStorage.getItem("act_token"); }catch(e){ return null; } }
function getRT(){ try{ return localStorage.getItem("act_refresh"); }catch(e){ return null; } }
function setTokens(a,r){ try{ if(a){localStorage.setItem("act_token",a);} else {localStorage.removeItem("act_token");} if(r){localStorage.setItem("act_refresh",r);} else if(r===null){localStorage.removeItem("act_refresh");} }catch(e){} }

var card=document.getElementById("card"), foot=document.getElementById("foot");
var pendingEmail=null;
start();

function fetchUser(token){ return fetch(SB_URL+"/auth/v1/user",{headers:{apikey:SB_KEY,Authorization:"Bearer "+token}}).then(function(r){ return r.ok?r.json():null; }); }

function start(){
  var at=getAT(), rt=getRT();
  if(!at && !rt){ showLogin(); return; }
  fetchUser(at).then(function(u){
    if(u){ showAccount(u); return; }
    // token expiré → refresh
    if(!rt){ setTokens(null,null); showLogin(); return; }
    fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j||!j.access_token){ setTokens(null,null); showLogin(); return; }
        setTokens(j.access_token,j.refresh_token);
        fetchUser(j.access_token).then(function(u2){ u2?showAccount(u2):showLogin(); });
      }).catch(function(){ showLogin(); });
  }).catch(function(){ showLogin(); });
}

/* ---- Connexion par code e‑mail ---- */
function showLogin(msgText){
  foot.innerHTML='Pas encore de compte ? <a href="/creer-compte">Créer mon compte</a>';
  card.innerHTML='<p class="intro">Connectez‑vous pour voir votre carte de fidélité. Vous recevrez un <b>code à 6 chiffres</b> par e‑mail.</p>'
    +'<label for="email">Votre e‑mail</label><input class="fi" id="email" type="email" autocomplete="email" placeholder="votre@email.fr" />'
    +'<div class="msg" id="msg">'+(msgText||"")+'</div>'
    +'<button class="btn" id="send">Recevoir mon code</button>';
  document.getElementById("send").onclick=function(){
    var email=document.getElementById("email").value.trim(), msg=document.getElementById("msg"); msg.textContent="";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent="E‑mail invalide."; return; }
    pendingEmail=email;
    var b=document.getElementById("send"); b.disabled=true; b.textContent="Envoi…";
    fetch(SB_URL+"/auth/v1/otp",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email,create_user:false})})
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
      .then(function(res){ if(!res.ok){ msg.textContent="Envoi impossible ("+(res.j.msg||res.j.error_description||"")+")."; b.disabled=false; b.textContent="Recevoir mon code"; return; } showCode(); })
      .catch(function(){ msg.textContent="Connexion impossible, réessayez."; b.disabled=false; b.textContent="Recevoir mon code"; });
  };
}
function showCode(){
  card.innerHTML='<p class="intro">Code envoyé à <b style="color:var(--bd)">'+esc(pendingEmail)+'</b></p>'
    +'<label for="code">Votre code à 6 chiffres</label>'
    +'<input class="code-in" id="code" inputmode="numeric" maxlength="8" placeholder="••••••" />'
    +'<div class="msg" id="msg"></div>'
    +'<button class="btn" id="verify">Se connecter</button>'
    +'<button class="btn ghost" id="back">← Changer d\'e‑mail</button>';
  var code=document.getElementById("code"); setTimeout(function(){try{code.focus();}catch(e){}},60);
  code.addEventListener("input",function(){ code.value=code.value.replace(/\D/g,"").slice(0,8); });
  document.getElementById("back").onclick=function(){ showLogin(); };
  document.getElementById("verify").onclick=function(){
    var c=code.value.replace(/\D/g,""), msg=document.getElementById("msg");
    if(c.length<6){ msg.textContent="Entrez les 6 chiffres."; return; }
    var b=document.getElementById("verify"); b.disabled=true; b.textContent="Vérification…";
    fetch(SB_URL+"/auth/v1/verify",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({type:"email",email:pendingEmail,token:c})})
      .then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
      .then(function(res){
        if(!res.ok||!res.j.access_token){ msg.textContent="Code incorrect ou expiré."; b.disabled=false; b.textContent="Se connecter"; return; }
        setTokens(res.j.access_token,res.j.refresh_token);
        card.innerHTML='<p class="count" style="text-align:center;padding:20px 0;">Chargement…</p>'; start();
      })
      .catch(function(){ msg.textContent="Connexion impossible, réessayez."; b.disabled=false; b.textContent="Se connecter"; });
  };
}

/* ---- Compte connecté ---- */
function OSTAT(k){ var m={new:["Nouvelle","#7C97AC"],nouvelle:["Nouvelle","#7C97AC"],confirmed:["Confirmée","#A6713F"],"payée":["Payée","#4A7C59"],ready:["Prête","#4A7C59"],delivered:["Livrée","#4A7C59"],cancelled:["Annulée","#A63333"]}; return m[k]||["En cours","#7C97AC"]; }
function showAccount(user){
  var meta=(user&&user.user_metadata)||{};
  var phone=normPhone(meta.phone||""), email=user.email||"", token=getAT();
  foot.innerHTML='<a href="#" id="logout">Se déconnecter</a>';
  foot.querySelector("#logout").onclick=function(e){ e.preventDefault(); setTokens(null,null); location.reload(); };
  var h={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
  Promise.all([
    phone?fetch(SB_URL+"/rest/v1/loyalty?phone=eq."+encodeURIComponent(phone)+"&select=*",{headers:h}).then(function(r){return r.json();}).catch(function(){return null;}):Promise.resolve(null),
    phone?fetch(SB_URL+"/rest/v1/caisse_ventes?phone=eq."+encodeURIComponent(phone)+"&select=total,items,created_at&order=created_at.desc&limit=100",{headers:h}).then(function(r){return r.json();}).catch(function(){return [];}):Promise.resolve([]),
    email?fetch(SB_URL+"/rest/v1/orders?email=eq."+encodeURIComponent(email)+"&select=*&order=created_at.desc&limit=50",{headers:h}).then(function(r){return r.json();}).catch(function(){return [];}):Promise.resolve([])
  ]).then(function(out){
    var row=(Array.isArray(out[0])&&out[0][0])||null;
    render(user, token, row, summarize(Array.isArray(out[1])?out[1]:[]), Array.isArray(out[2])?out[2]:[]);
  });
}
function summarize(rows){
  if(!rows.length) return null;
  var sum=0, prod={};
  rows.forEach(function(s){ sum+=Number(s.total)||0; (s.items||[]).forEach(function(it){ if(!it||!it.name||Number(it.price)<0) return; prod[it.name]=(prod[it.name]||0)+(Number(it.qty)||1); }); });
  var top=Object.keys(prod).map(function(k){return {name:k,qty:prod[k]};}).sort(function(a,b){return b.qty-a.qty;}).slice(0,4);
  return { count:rows.length, avg:sum/rows.length, top:top };
}
function render(user, token, row, hist, orders){
  var meta=(user&&user.user_metadata)||{};
  var prenom=meta.prenom||"", nom=meta.nom||"", phone=normPhone(meta.phone||""), email=user.email||"";
  var stamps=row?row.stamps:0, free=row?row.free_breads:0, total=row?row.total_stamps:0;
  var dots=""; for(var i=0;i<10;i++){ dots+='<span class="dot'+(i<stamps?' on':'')+'"></span>'; }

  var loy='<div class="result">'
    +'<div class="big">Bonjour '+esc(prenom||"")+' 👋</div>'
    +'<div class="dots">'+dots+'</div>'
    +'<div class="count"><b>'+stamps+' / 10</b> tampons'+(total?(' · '+total+' au total'):'')+'</div>'
    +(free>0?('<div class="free">🎁 '+free+' produit'+(free>1?'s':'')+' offert'+(free>1?'s':'')+' à récupérer sur notre stand !</div>')
            :('<div class="count" style="margin-top:12px;color:var(--is);">Plus que '+(10-stamps)+' tampon'+((10-stamps)>1?'s':'')+' avant votre produit offert !</div>'));
  if(phone){
    loy+='<div style="margin-top:16px;"><div style="font-size:12px;color:var(--is);margin-bottom:8px;">🎟️ Votre carte à présenter au marché</div>'
      +'<div id="myqr" style="display:inline-block;padding:10px;background:#fff;border:1px solid var(--bs);border-radius:12px;"></div>'
      +'<div style="font-size:14px;font-weight:600;color:var(--bd);margin-top:6px;">'+fmtPhone(phone)+'</div></div>';
  }
  loy+='</div>';

  var infos='<h2 class="sec">Mes informations</h2>'
    +'<div class="row2"><div><label>Prénom</label><input class="fi" id="f_prenom" value="'+esc(prenom)+'"/></div><div><label>Nom</label><input class="fi" id="f_nom" value="'+esc(nom)+'"/></div></div>'
    +'<label>E‑mail</label><input class="fi" value="'+esc(email)+'" disabled style="opacity:.6;background:var(--pp)"/>'
    +'<label>Téléphone <span style="color:var(--ru)">(carte de fidélité)</span></label><input class="fi" id="f_phone" inputmode="numeric" value="'+esc(fmtPhone(phone))+'" placeholder="06 12 34 56 78"/>'
    +'<label>Adresse</label><input class="fi" id="f_adr" placeholder="N° et rue" value="'+esc(meta.adresse||"")+'"/>'
    +'<div class="row2"><div><label>Code postal</label><input class="fi" id="f_cp" inputmode="numeric" value="'+esc(meta.cp||"")+'"/></div><div><label>Ville</label><input class="fi" id="f_ville" value="'+esc(meta.ville||"")+'"/></div></div>'
    +'<div class="msg" id="pmsg" style="color:var(--gn)"></div>'
    +'<button class="btn" id="saveProf">Enregistrer mes informations</button>';

  var cmd='<h2 class="sec">Mes commandes</h2>';
  if(orders && orders.length){
    cmd+=orders.map(function(o){
      var st=OSTAT(o.status);
      var its=(o.items||[]).map(function(it){return (it.qty||1)+"× "+esc(it.name);}).join(", ");
      var d=o.created_at?new Date(o.created_at).toLocaleDateString("fr-FR"):"";
      return '<div style="border:1px solid var(--bs);border-radius:12px;padding:12px;margin-bottom:10px;">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><span style="font-size:12px;color:var(--is)">'+d+(o.pickup_date?(' · retrait le '+esc(o.pickup_date)):'')+'</span>'
        +'<span style="font-size:11px;font-weight:600;color:'+st[1]+';border:1px solid '+st[1]+'66;border-radius:6px;padding:2px 8px;white-space:nowrap;">'+st[0]+'</span></div>'
        +'<div style="font-size:13px;margin-top:6px;">'+its+'</div>'
        +'<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px;"><span style="color:var(--is)">'+esc(o.shipping||o.payment_method||"")+'</span><b style="color:var(--bd)">'+eur(o.total)+'</b></div>'
        +'</div>';
    }).join("");
  } else {
    cmd+='<p class="count" style="font-size:14px;">Aucune commande pour le moment. <a href="/commander-marche" style="color:var(--bd);font-weight:600;">Commander au marché →</a></p>';
  }

  card.innerHTML=loy+infos+cmd
    +'<a href="/commander-marche" class="btn ghost" style="display:block;text-decoration:none;text-align:center;margin-top:18px;">Commander au marché</a>';

  try{ var qel=document.getElementById("myqr"); if(qel&&window.QRCode){ new QRCode(qel,{ text:phone, width:150, height:150, colorDark:"#2B2925", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M }); } }catch(e){}

  document.getElementById("saveProf").onclick=function(){
    var data={ prenom:document.getElementById("f_prenom").value.trim(), nom:document.getElementById("f_nom").value.trim(),
      phone:normPhone(document.getElementById("f_phone").value), adresse:document.getElementById("f_adr").value.trim(),
      cp:document.getElementById("f_cp").value.trim(), ville:document.getElementById("f_ville").value.trim() };
    var m=document.getElementById("pmsg"), b=document.getElementById("saveProf"); m.textContent=""; b.disabled=true; b.textContent="Enregistrement…";
    fetch(SB_URL+"/auth/v1/user",{method:"PUT",headers:{apikey:SB_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({data:data})})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(u){ if(u){ m.style.color="var(--gn)"; m.textContent="✓ Informations enregistrées."; } else { m.style.color="var(--rd)"; m.textContent="Échec, réessayez."; } b.disabled=false; b.textContent="Enregistrer mes informations"; })
      .catch(function(){ m.style.color="var(--rd)"; m.textContent="Connexion impossible."; b.disabled=false; b.textContent="Enregistrer mes informations"; });
  };
}
</script>
</body>
</html>
