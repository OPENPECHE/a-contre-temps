<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Votre ticket · à contre-temps</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#3E5A70" />
<link rel="icon" type="image/png" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{--bd:#3E5A70;--cr:#F3E7DA;--pp:#FBF8F4;--ink:#2B2925;--is:rgba(43,41,37,.6);--ru:#A6713F;--bs:#E6DFD3;--serif:'Fraunces',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--pp);line-height:1.5;padding:22px 14px 40px;}
  .card{max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--bs);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px -18px rgba(43,41,37,.3);}
  .top{background:var(--bd);color:var(--cr);text-align:center;padding:22px 16px 20px;position:relative;}
  .top .heart{height:34px;width:auto;margin:0 auto 8px;display:block;}
  .top .m{font-family:var(--serif);font-style:italic;font-size:22px;}
  .top .s{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.82;margin-top:3px;}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:10px;background:radial-gradient(circle at 7px -2px, transparent 6px, #fff 6.5px) repeat-x;background-size:14px 10px;}
  .body{padding:18px 18px 22px;}
  .when{font-size:12px;color:var(--is);text-align:center;margin-bottom:14px;}
  .ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #F0ECE5;font-size:14.5px;}
  .ln:last-of-type{border-bottom:none;}
  .ln .q{color:var(--bd);font-weight:600;}
  .ln b{white-space:nowrap;}
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--bd);}
  .tot .l{font-size:14px;color:var(--is);}
  .tot .v{font-family:var(--serif);font-size:26px;color:var(--bd);}
  .pay{text-align:right;font-size:12px;color:var(--is);margin-top:2px;}
  .tip{background:var(--cr);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink);margin-top:18px;text-align:center;}
  .ft{text-align:center;font-size:11.5px;color:var(--is);margin-top:16px;line-height:1.7;}
  .ft a{color:var(--bd);text-decoration:none;font-weight:600;}
  .empty{text-align:center;color:var(--is);padding:30px 10px;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="top"><img class="heart" src="/heart-cream.png" alt="" /><div class="m">à contre-temps</div><div class="s">Fournil vivant · Clermont-Ferrand</div></div>
  <div class="body" id="body"><div class="empty">Chargement du ticket…</div></div>
</div>
<script>
  function eur(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace(".",",")+" €"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;"})[c];}); }
  var PAY={ especes:"espèces", carte:"carte bancaire", sumup:"carte bancaire (SumUp)" };
  function render(){
    var box=document.getElementById("body");
    var h=(location.hash||"").replace(/^#/,"");
    if(!h){ box.innerHTML='<div class="empty">Ticket introuvable. Demandez à nouveau le QR code en caisse.</div>'; return; }
    var d;
    try{ d=JSON.parse(decodeURIComponent(escape(atob(h)))); }catch(e){ box.innerHTML='<div class="empty">Ticket illisible. Demandez à nouveau le QR code.</div>'; return; }
    var items=Array.isArray(d.i)?d.i:[];
    var when=""; try{ when=new Date(d.d||Date.now()).toLocaleString("fr-FR",{weekday:"long",day:"2-digit",month:"long",hour:"2-digit",minute:"2-digit"}); }catch(e){}
    var rows=items.map(function(l){ var name=l[0],qty=Number(l[1])||1,price=Number(l[2])||0; return '<div class="ln"><span><span class="q">'+qty+'×</span> '+esc(name)+'</span><b>'+eur(price*qty)+'</b></div>'; }).join("");
    box.innerHTML='<div class="when">'+esc(when)+'</div>'+rows
      +'<div class="tot"><span class="l">Total</span><span class="v">'+eur(d.t)+'</span></div>'
      +'<div class="pay">Payé en '+esc(PAY[d.p]||d.p||"")+'</div>'
      +'<div class="tip">📸 Faites une capture d\'écran pour conserver votre ticket.</div>'
      +'<div class="ft">Merci pour votre achat&nbsp;!<br><a href="https://www.fournilvivant.fr">fournilvivant.fr</a> · 06 01 48 28 90</div>';
  }
  render();
  window.addEventListener("hashchange", render);
</script>
</body>
</html>
