<style>
  :root{--bd:#3E5A70;--b:#7C97AC;--bs:#D6DFE5;--cr:#F3E7DA;--pp:#FBF8F4;--ink:#2B2925;--is:rgba(43,41,37,.62);--ru:#A6713F;--serif:'Fraunces',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--pp);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  header{background:var(--bd);text-align:center;padding:26px 20px;}
  header img{height:44px;width:auto;display:block;margin:0 auto 8px;}
  header .nm{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--cr);}
  .wrap{flex:1;max-width:460px;margin:0 auto;padding:40px 22px;text-align:center;display:flex;flex-direction:column;justify-content:center;}
  .stars{font-size:34px;letter-spacing:4px;color:#F4B400;margin-bottom:14px;}
  h1{font-family:var(--serif);font-weight:500;font-size:28px;color:var(--bd);margin-bottom:12px;}
  p.lead{font-size:16px;color:var(--is);margin-bottom:28px;}
  .btn{display:inline-block;background:var(--bd);color:var(--cr);padding:16px 30px;border-radius:999px;font-size:14px;letter-spacing:.06em;text-decoration:none;font-weight:600;box-shadow:0 10px 26px rgba(43,41,37,.14);}
  .btn .g{display:inline-flex;align-items:center;gap:9px;}
  .gdot{width:18px;height:18px;border-radius:50%;background:#fff;color:#4285F4;font-weight:700;font-family:Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
  .note{font-size:12.5px;color:var(--is);margin-top:22px;line-height:1.6;}
  footer{text-align:center;font-size:12px;color:var(--is);padding:20px;}
  footer a{color:var(--bd);}
</style>
</head>
<body>
<header>
  <img src="/heart-cream.png" alt="" />
  <div class="nm">à contre-temps</div>
</header>

  <div class="stars">★★★★★</div>

  <p class="lead">Votre avis nous aide énormément, et aide d'autres gourmands à nous trouver. Un petit mot, ça compte beaucoup&nbsp;!</p>
  <a class="btn" id="go" href="https://g.page/r/CYkDRN-qsC75ECE/review" target="_blank" rel="noopener">
