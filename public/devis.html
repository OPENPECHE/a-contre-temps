<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre devis — à contre-temps</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Votre devis — à contre-temps">
<meta property="og:description" content="Consultez votre devis gourmand et validez-le en ligne en un clic — à contre-temps, Fournil vivant.">
<meta property="og:image" content="https://www.fournilvivant.fr/og-image.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Votre devis — à contre-temps">

<meta name="twitter:image" content="https://www.fournilvivant.fr/og-image.png?v=3">
<link rel="icon" href="/heart-cream.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bd:#7894AC;--b:#7C97AC;--cr:#F3E7DA;--pp:#FBF8F4;--ru:#A6713F;--ink:#2B2925;--is:rgba(43,41,37,.62);--gn:#4A7C59;--bs:#e5ddce;--serif:'Fraunces',Georgia,serif;--sans:'Outfit',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--sans);color:var(--ink);background:var(--pp);line-height:1.6;padding:16px;}
  .wrap{max-width:620px;margin:0 auto;}
  .band{background:#7894AC;color:var(--cr);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;}
  .band img{height:58px;width:auto;border-radius:6px;display:block;}
  .band .bL{display:flex;align-items:center;gap:10px;}
  .band .n{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1;}
  .band .s{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,231,218,.75);margin-top:3px;}
  .band .ft{font-family:var(--serif);font-style:italic;font-size:22px;}
  .band .no{font-size:10px;color:rgba(243,231,218,.85);margin-top:3px;text-align:right;}
  .card{background:#fff;border:1px solid var(--bs);border-radius:14px;padding:18px;margin-top:16px;}
  .muted{color:var(--is);font-size:13px;}
  h2{font-family:var(--serif);font-weight:500;color:var(--bd);font-size:18px;margin-bottom:8px;}
  table{width:100%;border-collapse:collapse;margin:6px 0;}
  th{text-align:left;font-size:11px;letter-spacing:.04em;color:var(--is);border-bottom:1px solid var(--bs);padding:6px 4px;font-weight:600;}
  td{padding:9px 4px;border-bottom:1px solid #f1ead f;border-bottom:1px solid #f3ece0;font-size:13.5px;vertical-align:top;}
  td .d{font-size:11.5px;color:var(--is);margin-top:3px;}
  .tot{display:flex;justify-content:space-between;align-items:center;background:var(--bd);color:var(--cr);border-radius:8px;padding:11px 14px;margin-top:10px;font-family:var(--serif);font-size:17px;}
  label{font-size:12px;color:var(--is);display:block;margin-bottom:4px;}
  input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--bs);border-radius:9px;font-size:15px;font-family:var(--sans);background:var(--pp);}
  .pad{border:1px dashed var(--b);border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px;display:block;}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .row input[type=checkbox]{width:18px;height:18px;}
  .btn{display:block;width:100%;text-align:center;background:var(--bd);color:var(--cr);border:none;padding:14px;border-radius:999px;font-size:14px;letter-spacing:.04em;font-weight:600;cursor:pointer;margin-top:14px;font-family:var(--sans);}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .lnk{background:none;border:none;color:var(--ru);font-size:12px;cursor:pointer;text-decoration:underline;}
  .ok{background:#EAF3EC;border:1px solid #CBE3D3;color:#2f6b43;border-radius:10px;padding:14px;text-align:center;}
  .foot{text-align:center;color:var(--is);font-size:11px;margin:20px 0 10px;line-height:1.7;}
  .sigbox img{max-height:80px;}
  .modal-ov{position:fixed;inset:0;background:rgba(43,41,37,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:390px;width:100%;box-shadow:0 24px 60px -24px rgba(0,0,0,.55);}
  .modal h3{font-family:var(--serif);color:var(--bd);font-size:20px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--ink);line-height:1.65;}
  .dlbtn{display:block;width:100%;text-align:center;background:var(--cr);color:var(--bd);border:1px solid var(--bs);padding:11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px;font-family:var(--sans);}
  @media print{ .noprint{display:none!important;} body{padding:8mm;background:#fff;} .card{border:none;box-shadow:none;padding:0;margin-top:14px;} .band{border-radius:0;} .foot{margin-top:28px;} .tot{-webkit-print-color-adjust:exact;print-color-adjust:exact;} .band{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
</style></head>
<body><div class="wrap" id="wrap">
  <div class="band"><div class="bL"><img src="/logo-email.jpg" alt="à contre-temps"></div>
    <div><div class="ft">Devis</div><div class="no" id="d-no"></div></div></div>
  <div id="content"><div class="card muted" style="text-align:center">Chargement du devis…</div></div>
  <div class="foot">à contre-temps — Fournil vivant · 4 rue des Vignes Rousses, 63360 Gerzat · SIRET 108 719 105 00018<br>TVA non applicable, art. 293 B du CGI · Devis gratuit, valable 30 jours.</div>
</div>

<script>
var SB="https://jxxgafyqfbnqieiqltcn.supabase.co", KEY="sb_publishable_MdBMZ53hCDINWEu8jfsrzQ_sOeIuqZo";
function H(){return {"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
/* Ancien format texte (marqueurs) → conservé pour les anciens devis. */
function fmtDesc(s){var t=esc(s);t=t.replace(/\+\+([^+\n]+)\+\+/g,'<span style="font-size:1.3em">$1</span>');t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');return t.replace(/\n/g,"<br>");}
function sanitizeDesc(html){var s=String(html==null?"":html);s=s.replace(/<\/?(script|style|iframe|object|embed|link|meta|title|head|html|body)[^>]*>/gi,"");s=s.replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"");s=s.replace(/(href|src)\s*=\s*("\s*javascript:[^"]*"|'\s*javascript:[^']*')/gi,"");return s;}
function looksHtml(s){return /<[a-z!\/][\s\S]*>/i.test(String(s||""));}
function descToHtml(v){v=String(v==null?"":v);return looksHtml(v)?sanitizeDesc(v):fmtDesc(v);}
function eur(n){return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace(".",",")+" €";}
function dateFR(d){ if(!d) return ""; try{return new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"});}catch(e){return d;} }
function dateHeureFR(d){ try{return new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return d;} }

var id=new URLSearchParams(location.search).get("id");
var DEVIS=null, hasDrawn=false, ctx=null;

function load(){
  if(!id){ fail("Lien invalide."); return; }
  fetch(SB+"/rest/v1/invoices?id=eq."+encodeURIComponent(id)+"&type=eq.devis&select=*",{headers:H()})
    .then(function(r){return r.json();})
    .then(function(a){ if(!Array.isArray(a)||!a.length){ fail("Devis introuvable ou lien expiré."); return; } DEVIS=a[0]; render(); })
    .catch(function(){ fail("Impossible de charger le devis. Vérifiez votre connexion."); });
}
function fail(msg){ document.getElementById("content").innerHTML='<div class="card" style="text-align:center;color:var(--ru)">'+esc(msg)+'</div>'; }

function itemsTable(f){
  var its=Array.isArray(f.items)?f.items:[];
  var rows=its.map(function(it){ return '<tr><td>'+esc(it.label)+(it.desc?'<div class="d">'+descToHtml(it.desc)+'</div>':'')+'</td><td style="text-align:center">'+(Number(it.qty)||0)+'</td><td style="text-align:right;white-space:nowrap">'+eur(it.pu)+'</td><td style="text-align:right;white-space:nowrap">'+eur((Number(it.qty)||0)*(Number(it.pu)||0))+'</td></tr>'; }).join("");
  return '<table><thead><tr><th>Prestation</th><th style="text-align:center">Qté</th><th style="text-align:right">Prix unitaire</th><th style="text-align:right">Montant</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function render(){
  var f=DEVIS;
  document.getElementById("d-no").textContent="N° "+f.number;
  var head='<div class="card"><div class="muted">Établi le '+dateFR(f.issue_date)+(f.service_title?(' · Prestation : '+esc(f.service_title)+(f.service_date?(' du '+dateFR(f.service_date)):'')):(f.service_date?(' · Prestation prévue le '+dateFR(f.service_date)):''))+'</div>'
    +'<h2 style="margin-top:6px">Devis pour '+esc(f.client_name)+'</h2>'
    +((f.client_address||f.delivery_address)?('<div class="muted" style="margin-top:2px;font-size:13px;line-height:1.5">'+(f.client_address?('<b>Facturation :</b> '+esc(f.client_address)):'')+(f.delivery_address?((f.client_address?'<br>':'')+'<b>Livraison :</b> '+esc(String(f.delivery_address).replace(/\n/g,", "))):'')+'</div>'):'')
    +itemsTable(f)
    +'<div class="tot"><span>Montant total à payer</span><span>'+eur(f.total)+'</span></div>'
    +'<div class="muted" style="margin-top:4px;font-size:12px;text-align:right">Montant net · <b>TVA non applicable, art. 293 B du CGI</b></div>'
    +'<div class="muted" style="margin-top:8px">Conditions : '+esc(f.payment_terms||"À réception")+'. Devis valable 30 jours.</div>'
    +'<div class="noprint" style="display:flex;gap:10px;margin-top:14px"><button class="dlbtn" style="margin-top:0;flex:1" onclick="downloadDevis()">⬇ Télécharger (PDF)</button><button class="dlbtn" style="margin-top:0;flex:1" onclick="window.print()">🖨 Imprimer</button></div></div>';

  var body;
  if(f.signed_at){
    body='<div class="card"><div class="ok">✓ Devis accepté le '+dateHeureFR(f.signed_at)+(f.signed_name?' par <b>'+esc(f.signed_name)+'</b>':'')+'</div>'
      +'<p class="muted" style="text-align:center;margin-top:14px">Votre accord a bien été <b>transmis à à contre-temps</b>. Merci&nbsp;! Nous revenons vers vous pour la suite.</p></div>';
  } else {
    body='<div class="card noprint"><h2>Valider ce devis</h2>'
      +'<p class="muted" style="margin-bottom:14px">Vérifiez le devis ci-dessus. Pour l\'accepter, indiquez votre nom puis cliquez sur «&nbsp;Bon pour accord&nbsp;». Votre acceptation nous sera transmise immédiatement.</p>'
      +'<label>Votre nom et prénom</label><input type="text" id="sig-name" value="'+esc(f.client_name||"")+'" autocomplete="name">'
      +'<button class="btn" id="sig-btn" onclick="askConfirm()" style="margin-top:16px">✓ Bon pour accord — j\'accepte ce devis</button>'
      +'<p class="muted" style="text-align:center;margin-top:10px;font-size:11px">En cliquant, vous acceptez ce devis (valeur d\'accord en ligne, horodaté).</p>'
      +'<p id="sig-err" class="muted" style="color:var(--ru);display:none;margin-top:8px"></p></div>';
  }
  document.getElementById("content").innerHTML=head+body;
}

function askConfirm(){
  var err=document.getElementById("sig-err"); err.style.display="none";
  var name=(document.getElementById("sig-name").value||"").trim();
  if(!name){ err.textContent="Merci d'indiquer votre nom."; err.style.display="block"; return; }
  var ov=document.createElement("div"); ov.className="modal-ov";
  ov.innerHTML='<div class="modal"><h3>Confirmer l\'acceptation</h3>'
    +'<p>Vous êtes sur le point d\'accepter le <b>devis N° '+esc(DEVIS.number)+'</b> d\'un montant de <b>'+eur(DEVIS.total)+'</b>.</p>'
    +'<p style="margin-top:8px">En confirmant votre <b>«&nbsp;bon pour accord&nbsp;»</b>, vous validez votre commande auprès de à contre-temps — cet accord vous engage.</p>'
    +'<button class="btn" id="mc-yes" style="margin-top:16px">✓ Oui, j\'accepte le devis</button>'
    +'<button class="lnk" id="mc-no" style="display:block;margin:12px auto 0">Annuler</button></div>';
  document.body.appendChild(ov);
  ov.addEventListener("click",function(e){ if(e.target===ov) ov.remove(); });
  document.getElementById("mc-no").onclick=function(){ ov.remove(); };
  document.getElementById("mc-yes").onclick=function(){ ov.remove(); doAccord(name); };
}
function doAccord(name){
  var err=document.getElementById("sig-err"); if(err) err.style.display="none";
  var b=document.getElementById("sig-btn"); if(b){ b.disabled=true; b.textContent="Validation…"; }
  var patch={ signed_name:name, signed_at:new Date().toISOString(), signature:"accord-en-ligne", status:"paid" };
  fetch(SB+"/rest/v1/invoices?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign(H(),{"Prefer":"return=representation"}),body:JSON.stringify(patch)})
    .then(function(r){ return r.json(); })
    .then(function(a){ var row=Array.isArray(a)?a[0]:a; DEVIS=row||Object.assign(DEVIS,patch);
      try{ fetch("/api/send-email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:"devis_accepted",devis:{number:DEVIS.number,client_name:DEVIS.client_name,client_email:DEVIS.client_email,total:DEVIS.total,service_date:DEVIS.service_date,signed_name:name,signed_at:patch.signed_at,items:DEVIS.items}})}).catch(function(){}); }catch(e){}
      render(); window.scrollTo({top:0,behavior:"smooth"});
    })
    .catch(function(){ if(err){ err.textContent="Échec de l'enregistrement, réessayez."; err.style.display="block"; } if(b){ b.disabled=false; b.textContent="✓ Bon pour accord — j'accepte ce devis"; } });
}
function downloadDevis(){
  if(!DEVIS) return;
  var name="Devis-"+String(DEVIS.number||"").replace(/[^\w-]/g,"")+".pdf";
  // on clone la page rendue, on retire le formulaire / boutons / scripts
  var docClone=document.documentElement.cloneNode(true);
  docClone.querySelectorAll(".noprint, script").forEach(function(x){ x.remove(); });
  var html="<!DOCTYPE html>"+docClone.outerHTML;
  // mise en page pleine page A4 : pied de page poussé en bas
  var styleFix='<style>@page{size:A4;margin:0;}body{margin:0;padding:0;background:#fff;}'
    +'.wrap{max-width:none;width:100%;margin:0;padding:14mm;min-height:290mm;display:flex;flex-direction:column;box-sizing:border-box;}'
    +'.foot{margin-top:auto;padding-top:24px;} .card{box-shadow:none;}</style>';
  html=html.replace("</head>", styleFix+"</head>");
  var inject='<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></scr'+'ipt>'
    +'<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){try{'
    +'html2pdf().set({margin:0,filename:'+JSON.stringify(name)+',image:{type:"jpeg",quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}}).from(document.body).save().then(function(){parent.postMessage("acp-pdf-done","*");}).catch(function(){parent.postMessage("acp-pdf-fail","*");});'
    +'}catch(e){parent.postMessage("acp-pdf-fail","*");}},600);});</scr'+'ipt>';
  html=html.replace("</body>", inject+"</body>");
  var ifr=document.createElement("iframe"); ifr.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1300px;border:0;";
  document.body.appendChild(ifr);
  var d=ifr.contentWindow.document; d.open(); d.write(html); d.close();
  var onMsg=function(e){ if(e.data==="acp-pdf-done"||e.data==="acp-pdf-fail"){ window.removeEventListener("message",onMsg); if(e.data==="acp-pdf-fail") alert("Échec du téléchargement. Utilisez « Imprimer » → « Enregistrer en PDF »."); setTimeout(function(){ try{ifr.remove();}catch(_){} },700); } };
  window.addEventListener("message",onMsg);
  setTimeout(function(){ window.removeEventListener("message",onMsg); try{ifr.remove();}catch(_){} }, 20000);
}
load();
</script>
</body></html>
